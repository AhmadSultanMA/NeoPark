version: "3.8"

services:
  neopark-server:
    build: . # Menggunakan Dockerfile di root
    container_name: neopark-parking-system
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs # Untuk log aplikasi Flask
      - ./Server:/app # Mount source code untuk development
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - FLASK_APP=neopark_server.py
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5000/combined/status || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - neopark-network

  nginx:
    image: nginx:alpine
    container_name: neopark-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Website:/usr/share/nginx/html/website:ro
    depends_on:
      neopark-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - neopark-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: neopark-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
      - "--log.level=info"
    restart: unless-stopped
    user: "65534:65534" # nobody user
    networks:
      - neopark-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: neopark-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SECURITY_ALLOW_EMBEDDING=true
    restart: unless-stopped
    user: "472:0" # grafana user
    depends_on:
      - prometheus
    networks:
      - neopark-network

networks:
  neopark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local