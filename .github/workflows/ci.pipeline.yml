name: NeoPark Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_lint_and_test:
    runs-on: ubuntu-latest
    # Conditional execution berdasarkan commit message
    if: contains(github.event.head_commit.message, 'TEST') || contains(github.event.pull_request.title, 'TEST')

    strategy:
      matrix:
        python-version: ["3.9"]

    steps:
      - name: Show commit message
        run: |
          echo "Commit message: ${{ github.event.head_commit.message }}"
          echo "Running tests because commit contains 'TEST'"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Create basic flake8 config
          echo "[flake8]" > .flake8
          echo "max-line-length = 88" >> .flake8
          echo "ignore = E203,W503" >> .flake8

          # Lint with better error handling
          if [ -d "Server/" ]; then
              flake8 Server/ || echo "⚠️ Linting issues found in Server/"
          fi

          if [ -d "tests/" ]; then
              flake8 tests/ || echo "⚠️ Linting issues found in tests/"
          fi

      - name: Run tests with pytest
        run: |
          if [ -d "tests/" ] && [ "$(find tests/ -name '*.py' | wc -l)" -gt 0 ]; then
              pytest -v tests/
          else
              echo "No test files found - creating basic health check test"
              mkdir -p tests
              cat > tests/test_health.py << 'EOF'
          import sys
          import os
          sys.path.append(os.path.join(os.path.dirname(__file__), '..', 'Server'))

          def test_import_server():
              """Test that server file can be imported"""
              try:
                  # Basic import test
                  import importlib.util
                  spec = importlib.util.spec_from_file_location("neopark_server", "Server/neopark_server.py")
                  assert spec is not None
                  print("✅ Server file structure is valid")
              except Exception as e:
                  print(f"❌ Server import failed: {e}")
                  raise

          def test_requirements_file():
              """Test that requirements.txt exists and is readable"""
              assert os.path.exists("requirements.txt"), "requirements.txt not found"
              with open("requirements.txt", "r") as f:
                  content = f.read()
                  assert len(content) > 0, "requirements.txt is empty"
              print("✅ Requirements file is valid")
          EOF
              pytest -v tests/
          fi

      - name: Build Docker image
        if: success()
        run: |
          docker build . --file Dockerfile --tag neopark-server-ci:$(date +%s)

  # Job untuk memberikan info jika tests di-skip
  skip_notification:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'TEST') && !contains(github.event.pull_request.title, 'TEST')"
    steps:
      - name: Skip notification
        run: |
          echo "⏭️ Tests skipped because commit message doesn't contain 'TEST'"
          echo "Current commit: ${{ github.event.head_commit.message }}"
          echo ""
          echo "💡 To run tests, include 'TEST' in your commit message:"
          echo "   git commit -m 'Fix authentication TEST'"
          echo "   git commit -m 'TEST: Add new endpoint'"
