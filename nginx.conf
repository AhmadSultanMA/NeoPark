events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Upstream untuk Flask app
    upstream flask_app {
        server neopark-server:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Static files
        location /website/ {
            alias /usr/share/nginx/html/website/;
            index neopark-dashboard.html index.html index.htm;
            try_files $uri $uri/ $uri/neopark-dashboard.html $uri/index.html =404;
            expires 1d;
            add_header Cache-Control "public, immutable";
            
            # Fix permission issues
            location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|json)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
        
        # Direct access to dashboard
        location /dashboard {
            alias /usr/share/nginx/html/website/neopark-dashboard.html;
            add_header Content-Type text/html;
        }

        # Proxy untuk Flask app
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}